version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - openvas_sock:/run/gvmd
    environment:
      - POSTGRES_URL=postgresql://kimia:kimia_password@db:5432/kimia_db
      - REDIS_URL=redis://redis:6379/0
      - VAULT_URL=http://vault:8200
      - VAULT_TOKEN=root
      - KEYCLOAK_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_CLIENT_SECRET=kimia-backend-secret
      - TZ=Africa/Lagos
    depends_on:
      - db
      - redis
      - vault

  celery-worker:
    build: .
    command: celery -A src.core.celery_app worker --loglevel=info
    volumes:
      - ./src:/app/src
      - openvas_sock:/run/gvmd
    environment:
      - POSTGRES_URL=postgresql://kimia:kimia_password@db:5432/kimia_db
      - REDIS_URL=redis://redis:6379/0
      - VAULT_URL=http://vault:8200
      - VAULT_TOKEN=root
      - KEYCLOAK_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_CLIENT_SECRET=kimia-backend-secret
      - TZ=Africa/Lagos
    depends_on:
      - api
      - db
      - redis
      - openvas

  celery-beat:
    build: .
    command: celery -A src.core.celery_app beat --loglevel=info
    volumes:
      - ./src:/app/src
    environment:
      - POSTGRES_URL=postgresql://kimia:kimia_password@db:5432/kimia_db
      - REDIS_URL=redis://redis:6379/0
      - VAULT_URL=http://vault:8200
      - VAULT_TOKEN=root
      - TZ=Africa/Lagos
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: kimia
      POSTGRES_PASSWORD: kimia_password
      POSTGRES_DB: kimia_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: db
      KC_DB_URL_DATABASE: kimia_db
      KC_DB_URL_PORT: 5432
      KC_DB_USERNAME: kimia
      KC_DB_PASSWORD: kimia_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json
      - ../kerubiscan_frontend/keycloak-theme/dist_keycloak:/opt/keycloak/providers
    depends_on:
      - db

  vault:
    image: hashicorp/vault:1.15
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK

  openvas:
    image: immauss/openvas:latest
    ports:
      - "9392:9392"
      - "9390:9390"
    environment:
      - PUBLIC_HOSTNAME=localhost
      - PASSWORD=admin
      - SKIPSYNC=true
    volumes:
      - openvas_data:/data
      - openvas_sock:/run/gvmd

volumes:
  postgres_data:
  openvas_data:
  openvas_sock:
